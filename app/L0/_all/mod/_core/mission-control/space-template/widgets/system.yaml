schema: space-widget/v1
id: system
name: System
cols: 5
rows: 3
col: 0
row: 0
renderer: |-
  async (parent) => {
    const { bytes, css, escapeHtml, loadSnapshot } = await import("/mod/_core/mission-control/widget-runtime.js")
    const root = css(parent)
    const snapshot = await loadSnapshot()
    const system = snapshot.providers?.system?.data || {}
    const topMemory = snapshot.providers?.processes?.data?.topMemory || []
    const used = Math.max(0, Number(system.totalMemoryBytes || 0) - Number(system.freeMemoryBytes || 0))
    const pct = system.totalMemoryBytes ? Math.round((used / system.totalMemoryBytes) * 100) : 0
    root.innerHTML = `
      <h3>System</h3>
      <div class="row"><span class="muted">Host</span><strong>${system.hostname || "local"}</strong></div>
      <div class="row"><span class="muted">Memory</span><strong>${pct}%</strong></div>
      <div class="row"><span class="muted">Used</span><strong>${bytes(used)}</strong></div>
      <div class="row"><span class="muted">CPU</span><strong>${system.cpuUsagePercent === null || system.cpuUsagePercent === undefined ? "n/a" : `${system.cpuUsagePercent}%`}</strong></div>
      ${topMemory.slice(0, 4).map((proc) => `<div class="row"><span>${escapeHtml(proc.name || "process")}</span><strong>${bytes(proc.workingSetBytes)}</strong></div>`).join("")}
    `
  }
